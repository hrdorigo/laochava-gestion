<style>
:root{--side:#111112;--bg:#f4f6f9;--ink:#1f2d3d;--mut:#6c757d;--card:#fff;--line:#dee2e6;--pri:#007bff;--low:#fff3cd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1f23;--ink:#e8ecf0;--mut:#9aa4ae;--card:#262a30;--line:#3a3f46;--low:#4a4020}}
:root[data-theme="dark"]{--bg:#1c1f23;--ink:#e8ecf0;--mut:#9aa4ae;--card:#262a30;--line:#3a3f46;--low:#4a4020}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;font-family:"Source Sans Pro",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
aside{width:250px;background:var(--side);color:#c2c7d0;overflow-y:auto;flex-shrink:0;transition:margin .3s}
.brand{background:#F3F2F1;color:#222;height:57px;display:grid;place-items:center;font-weight:800;font-size:20px}
.g{padding:.5rem 1rem;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
.g:hover,.l:hover{background:rgba(255,255,255,.08);color:#fff}
.sub{display:none}.open>.sub{display:block}
.l{display:block;padding:.5rem 1rem .5rem 1.5rem;cursor:pointer;font-size:1rem}.l.on,.g.on{background:var(--pri);color:#fff}
main{flex:1;min-width:0;overflow-y:auto}
header{display:flex;align-items:center;gap:12px;padding:15px .5rem}
h1{margin:0;font-size:1.7rem;font-weight:400}
#bg{display:none;border:0;background:var(--pri);color:#fff;border-radius:4px;padding:8px 12px;font-size:18px}
#v{padding:0 .5rem 24px}
.card{background:var(--card);border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.15);padding:1.25rem;margin-bottom:1rem}
.hero{min-height:220px;display:grid;place-items:center;text-align:center;border-radius:16px;background:linear-gradient(135deg,#cfe3ee,#e4efdc 60%,#d8e6f3);color:#1f2d3d;padding:24px;margin-bottom:14px}
.hero h2{margin:0;font-size:clamp(2rem,5vw,3.6rem);font-weight:800;letter-spacing:-.03em}
.hero i{display:block;width:100px;height:4px;border-radius:9px;background:linear-gradient(90deg,#17a2b8,#28a745);margin:16px auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:10px}
.b{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;padding:.25rem .75rem;cursor:pointer;font:inherit;font-size:.875rem;line-height:1.5}
.b.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.q{min-width:80px;height:60px;color:#fff;border:0;font-size:12px;font-weight:600;padding:15px 5px}
.in,select,label input,label select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:.25rem;padding:.25rem .5rem;font:inherit;font-size:.875rem;line-height:1.5;min-height:31px;max-width:100%}
label{display:block;margin-bottom:.25rem;font-size:.875rem;font-weight:700}label input,label select{display:block;width:100%;margin-top:2px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.875rem}
th,td{padding:.5rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr.low{background:var(--low)}td a{color:var(--pri);cursor:pointer;margin-right:8px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k div{background:var(--card);border-radius:6px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.15)}.k b{display:block;font-size:1.3rem}.k small{color:var(--mut)}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:50;padding:12px}
#m.s{display:grid}#mb{background:var(--card);color:var(--ink);padding:1rem;border-radius:.3rem;width:min(96vw,500px);max-height:90vh;overflow:auto}
#mb h3{margin-top:0;font-size:1.25rem;font-weight:500}.r{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#t2{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#343a40;color:#fff;padding:10px 16px;border-radius:4px;display:none;z-index:60}
.sticky{position:sticky;bottom:0;z-index:5}
@media(max-width:0px){#v{padding:6px 8px 16px}h1{font-size:1.3rem}.b,.in,select,label input,label select{min-height:44px;font-size:16px}.row>label{flex:1 1 100%!important;min-width:0!important;width:auto!important}.sc table,.sc thead,.sc tbody,.sc tr,.sc td{display:block}.sc thead{display:none}.sc tr{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;padding:4px 6px}.sc td{border:0;white-space:normal;display:flex;justify-content:space-between;gap:8px;padding:3px 2px}.sc td::before{content:attr(data-l);font-weight:600;color:var(--mut)}.sc td:empty{display:none}#mb{width:100%;height:100%;max-height:100%;border-radius:0}#m{padding:0}.k{grid-template-columns:1fr 1fr}.hero{min-height:150px}}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.5rem 1rem}
@media(min-width:700px){.w2{grid-column:span 2}}
.fg label{margin:0}
.ig{display:flex}.ig>input,.ig>select{flex:1;min-width:0;border-radius:.25rem 0 0 .25rem}
.ig>.ab{background:#17a2b8;border:1px solid #17a2b8;color:#fff;border-radius:0 .25rem .25rem 0;padding:0 .75rem;cursor:pointer;font:inherit;font-size:.875rem;white-space:nowrap}
.ig>.pa{display:flex;align-items:center;border:1px solid var(--line);border-right:0;border-radius:.25rem 0 0 .25rem;padding:0 .6rem;background:var(--card)}
.ig>.pa+input{border-radius:0 .25rem .25rem 0;text-align:right}
.ro{background:var(--line)!important;color:var(--ink)}.ctr{text-align:center}
#hp{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));width:38px;height:38px;border-radius:50%;border:0;background:#17a2b8;color:#fff;font-size:20px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:45;cursor:pointer}
@media(max-width:800px){#bg{position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top,0px));width:38px;height:38px;border-radius:50%;padding:0;z-index:45;box-shadow:0 2px 6px rgba(0,0,0,.3)}header{padding-left:56px;padding-right:56px}}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.g,.l{border-radius:.25rem;align-items:center;gap:.65rem}.g{margin:2px .5rem}
.g .tx{flex:1}.g .ch{width:14px;height:14px;transition:transform .2s}
.mg.open>.g{background:rgba(255,255,255,.1);color:#fff}.mg.open>.g .ch{transform:rotate(-90deg)}
.l{display:flex;margin:2px .5rem;padding:.5rem 1rem .5rem 1.75rem;font-size:.95rem}.l .ic{width:16px;height:16px}
.vb{background:#6c757d;color:#fff;border-radius:.25rem;font-size:.7rem;padding:1px 6px;font-weight:700}
.up{display:flex;gap:12px;align-items:center;padding:1rem;margin:0 .5rem .5rem;border-bottom:1px solid rgba(255,255,255,.15)}.up b{display:block;color:#fff;font-weight:400}.up small{color:#d7dee6}
.av{width:36px;height:36px;border-radius:50%;background:#e9d5b5;color:#243447;display:grid;place-items:center}.av .ic{width:22px;height:22px}
.q{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 5px}.q .ic{width:22px;height:22px}
.b .ic,td a .ic{width:14px;height:14px;vertical-align:-2px;margin-right:2px}.ab .ic{width:15px;height:15px;vertical-align:-3px;margin-right:2px}
.mh{display:flex;justify-content:space-between;align-items:center;margin:-1rem -1rem 1rem;padding:1rem;border-bottom:1px solid var(--line)}.mh h3{margin:0!important}
.xx{background:none;border:0;font-size:1.7rem;line-height:1;color:#6c757d;cursor:pointer}
.dt,.dt th,.dt td{border:1px solid var(--line)}.dt th{background:var(--line);cursor:pointer;white-space:nowrap}.dt td{white-space:normal}.dt th span{float:right;opacity:.55;margin-left:8px}
.sel{background:#28a745;color:#fff;border:0;border-radius:.2rem;padding:.25rem .75rem;cursor:pointer;font:inherit;font-size:.875rem}
.pgn{display:inline-flex;border:1px solid var(--line);border-radius:.25rem}.pgn a{padding:.375rem .75rem;border-right:1px solid var(--line);color:#007bff;cursor:pointer}.pgn a:last-child{border:0}.pgn a.cur{background:#007bff;color:#fff}.pgn a.dis{color:#6c757d;cursor:default}
.bgp{display:flex;flex-wrap:wrap}.bgp>.gb,.bgp .dd>.gb{border:1px solid #adb5bd;background:var(--card);color:var(--ink);padding:.25rem .75rem;min-width:40px;height:31px;cursor:pointer;font:inherit;font-size:.875rem;border-radius:0;margin-left:-1px}
.bgp>.gb:first-child{border-radius:.25rem 0 0 .25rem;margin-left:0}.gb .ic{width:14px;height:14px;vertical-align:-2px}
.bgp .bl{background:#007bff;color:#fff;border-color:#007bff}.bgp .dk{background:#5a6268;color:#fff;border-color:#5a6268}.bgp .gn{background:#28a745;color:#fff;border-color:#28a745;border-radius:0 .25rem .25rem 0}
.dd{position:relative;display:inline-flex}.dm{position:absolute;bottom:100%;left:0;background:var(--card);border:1px solid var(--line);border-radius:.25rem;display:none;min-width:190px;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}.dm.on{display:block}.dm a{display:block;padding:.4rem .75rem;cursor:pointer;color:var(--ink)}.dm a:hover{background:var(--line)}
.b.gr{background:#28a745;color:#fff;border-color:#28a745}
#lg{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;z-index:100;padding:16px}#lg>div{background:var(--card);width:min(100%,380px);padding:1.5rem;border-radius:.5rem;box-shadow:0 2px 12px rgba(0,0,0,.25)}
body.lock aside,body.lock main,body.lock #bg,body.lock #hp{display:none!important}
@media print{aside,header,.row,.r,#t2{display:none!important}body{display:block}main{overflow:visible}}
textarea{width:100%;min-height:90px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px}
@media(max-width:800px){aside{position:fixed;height:100%;z-index:40;margin-left:-250px}body.mn aside{margin-left:0}#bg{display:block}}
</style>

<body class="lock">
<aside><div class="brand" id="br"></div><div id="menu"></div></aside>
<main><header><button id="bg" aria-label="Menú">☰</button><h1 id="t"></h1></header><div id="v"></div></main>
<div id="lg"><div><img id="lg_i" alt="" style="width:100%;margin-bottom:12px"><h3 style="margin:0 0 12px;font-weight:400">Ingresar al sistema</h3><label>Mail<input id="lg_m" type="email" autocomplete="username" onkeydown="if(event.key=='Enter')$('#lg_p').focus()"></label><label>Contraseña<input id="lg_p" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')lgIn()"></label><div id="lg_e" style="color:#dc3545;min-height:1.4em;margin:6px 0"></div><button id="lg_b" class="b p" style="width:100%" onclick="lgIn()">Ingresar</button><p style="text-align:center;margin:12px 0 0"><a style="color:#007bff;cursor:pointer" onclick="lgReset()">Olvidé mi contraseña</a></p></div></div>
<div id="m"><div id="mb"></div></div><button id="hp" aria-label="Ayuda" onclick="ayud()">?</button><div id="t2"></div>
<script>
const $=s=>document.querySelector(s),K='gestion_v1';
let DB;try{DB=JSON.parse(localStorage.getItem(K))}catch(e){}
DB=DB||{cfg:{nombre:'La Ochava',cuit:'',pv:'0001'},seq:100,n:{},doc:[],mov:[],pro:[],
cli:[{id:1,nombre:'Consumidor Final',doc:'',tel:'',email:''}],
art:[{id:2,cod:'1001',nombre:'Cable USB-C 1m',rubro:'Cables',costo:1500,precio:3200,stock:25,min:5},{id:3,cod:'1002',nombre:'Auriculares Bluetooth',rubro:'Audio',costo:12000,precio:24500,stock:4,min:5}]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){}if(window.cloudQ)cloudQ()};
const AUX=['rub','mar','ban','zon','tra','uni','pci','mot','cc','dg','di','prv','pai','cat'];
['vend','chq','cob','pag','sm','aud','inf','rec','st','tec','pr',...AUX].forEach(k=>DB[k]=DB[k]||[]);
const M$=n=>(+n||0).toLocaleString('es-AR',{style:'currency',currency:'ARS'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const nid=()=>++DB.seq;
function toast(s){const e=$('#t2');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function openM(h){$('#mb').innerHTML=h;$('#m').classList.add('s')}
function closeM(){if(window.scanStop)scanStop();window.afterC=null;$('#mb').style.width='';$('#m').classList.remove('s')}
let _f;function ask(msg,f){_f=f;openM(`<p>${msg}</p><div class="r"><button class="b" onclick="closeM()">Cancelar</button><button class="b p" onclick="closeM();_f()">Aceptar</button></div>`)}
function setV(t,h){window.VK=false;$('#t').textContent=t;$('#v').innerHTML=h;document.body.classList.remove('mn')}
function tbl(cols,rows,cls){return `<div class="sc"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${cls?cls(r):''}">${cols.map(c=>`<td data-l="${c[0]}">${c[1](r)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="9">Sin datos</td></tr>'}</tbody></table></div>`}
function filt(i){const v=i.value.toLowerCase();document.querySelectorAll('#v tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v)?'':'none')}
const FM={art:[['cod','Código'],['nombre','Nombre'],['rubro','Rubro'],['marca','Marca'],['costo','Costo','$'],['precio','Precio','$'],['stock','Stock','n'],['min','Stock mín.','n']],
cli:[['num','N° de cliente'],['nombre','Nombre y apellido'],['doc','DNI'],['dir','Dirección'],['loc','Localidad'],['cel','Celular'],['email','Email'],['obs','Observaciones']],pro:[['nombre','Nombre'],['doc','CUIT'],['tel','Teléfono'],['email','Email']]};
const TT={art:'Artículos',cli:'Clientes',pro:'Proveedores',vend:'Vendedores',chq:'Cheques',rub:'Rubros',mar:'Marcas',ban:'Bancos',zon:'Zonas',tra:'Transportes',uni:'Unidades',pci:'Pago digital',mot:'Motivos de salida',cc:'Categorías de compras',dg:'Detalle de gastos',di:'Detalle de ingresos',prv:'Provincias',pai:'Países',cat:'Categorías'};
AUX.forEach(k=>FM[k]=[['nombre','Nombre']]);
const nextNum=()=>Math.max(0,...DB.cli.map(c=>parseInt(c.num)||0))+1;
FM.vend=[['nombre','Nombre'],['tel','Teléfono']];
FM.chq=[['num','Número'],['banco','Banco'],['importe','Importe','$'],['fecha','Recibido el','d'],['vence','Vence','d'],['estado','Estado (Recibido / Entregado / Cobrado)']];
function list(k){const F=FM[k];
setV(TT[k],`<div class="row"><input class="in" placeholder="Buscar" oninput="filt(this)"><button class="b p" onclick="frm('${k}')">Nuevo</button></div><div class="card">`+
tbl([...F.map(f=>[f[1],r=>f[2]=='$'?M$(r[f[0]]):esc(r[f[0]])]),['',r=>`<a onclick="frm('${k}',${r.id})">Editar</a><a onclick="del('${k}',${r.id})">Borrar</a>`]],DB[k],k=='art'?r=>r.stock<=r.min?'low':'':null)+'</div>')}
function frm(k,i){const r=i?DB[k].find(x=>x.id==i):{};
openM(`<h3>${i?'Editar':'Nuevo'} registro</h3>${FM[k].map(f=>`<label>${f[1]}<input id="f_${f[0]}" ${f[2]=='d'?'type="date"':f[2]?'type="number" step="any"':''} value="${esc(r[f[0]]??(k=='cli'&&f[0]=='num'?nextNum():''))}"></label>`).join('')}<div class="r"><button class="b" onclick="closeM()">Cancelar</button><button class="b p" onclick="saveF('${k}',${i||0})">Guardar</button></div>`)}
function saveF(k,i){const o=i?DB[k].find(x=>x.id==i):{id:nid()};
FM[k].forEach(f=>{const v=$('#f_'+f[0]).value;o[f[0]]=f[2]&&f[2]!='d'?+v||0:v.trim()});
const rq=k=='cli'?['nombre','Nombre y apellido']:FM[k][0];if(!o[rq[0]])return toast('Falta '+rq[1]);if(k=='cli'&&o.num&&DB.cli.some(c=>c.id!=o.id&&String(c.num)==o.num))return toast('Ese número de cliente ya existe');if(!i)DB[k].push(o);save();closeM();list(k)}
function del(k,i){ask('¿Borrar este registro?',()=>{DB[k]=DB[k].filter(x=>x.id!=i);save();go(k)})}
/* Carrito: ventas (v) y compras (c) */
let C={};
function cart(m,tipo){C={m,tipo,items:[],ent:m=='v'?1:(DB.pro[0]||{}).id,pago:'Efectivo',dto:0};drawCart()}
function drawCart(){const v=C.m=='v',sub=C.items.reduce((s,i)=>s+i.q*i.p,0),tot=sub*(1-C.dto/100);
setV(v?C.tipo=='Factura'?'Facturas (Factura C)':C.tipo=='Nota de Crédito'?'Notas de crédito':C.tipo+'s':'Ingreso de mercadería',`<div class="card"><div class="row">
<label>${v?'Cliente':'Proveedor'}<select onchange="C.ent=+this.value;cliDef()">${(v?DB.cli:DB.pro).map(c=>`<option value="${c.id}" ${c.id==C.ent?'selected':''}>${esc(c.nombre)}</option>`).join('')||'<option value="0">Sin proveedor</option>'}</select></label>
${v?`<label>Pago<select onchange="C.pago=this.value">${['Efectivo','Transferencia','Tarjeta','Cuenta corriente'].map(p=>`<option ${p==C.pago?'selected':''}>${p}</option>`).join('')}</select></label><label>Lista<select onchange="C.lista=+this.value">${[1,2,3,4,5,6].map(n=>`<option value="${n-1}" ${C.lista==n-1?'selected':''}>Lista ${n}</option>`).join('')}</select></label><label>Vendedor<select onchange="C.vend=this.value"><option value="">—</option>${DB.vend.map(x=>`<option ${x.nombre==C.vend?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select></label><label>Descuento %<input type="number" min="0" max="100" value="${C.dto}" onchange="C.dto=Math.min(100,+this.value||0);drawCart()"></label>`:''}</div>
<div class="row"><label>Artículo (código o nombre)<input id="q" list="dl" onchange="pick()"></label><datalist id="dl">${DB.art.map(a=>`<option value="${esc(a.cod)} – ${esc(a.nombre)}">`).join('')}</datalist>
<label>Cant.<input id="qt" type="number" min="1" value="1" style="width:80px"></label><label>${v?'Precio':'Costo'}<input id="pr" type="number" step="any" style="width:110px"></label><button class="b p" onclick="addL()">Agregar</button></div>
${tbl([['Artículo',i=>esc(i.n)],['Cant.',i=>i.q],['Precio',i=>M$(i.p)],['Subtotal',i=>M$(i.q*i.p)],['',i=>`<a onclick="C.items.splice(${C.items.indexOf(i)},1);drawCart()">Quitar</a>`]],C.items)}
<div class="row" style="justify-content:space-between;margin-top:12px"><b style="font-size:1.4rem">Total: ${M$(tot)}</b><button class="b p" onclick="emit()">${v?'Emitir '+C.tipo:'Registrar ingreso'}</button></div></div>`)}
function find(){const q=$('#q').value.trim().toLowerCase();return DB.art.find(a=>(a.cod+' – '+a.nombre).toLowerCase()==q||a.cod.toLowerCase()==q||a.nombre.toLowerCase()==q)}
function pick(){const a=find();if(a)$('#pr').value=C.m=='v'?(lv(a,C.lista|0)||a.precio):a.costo}
function addL(){const a=find(),q=+$('#qt').value,p=+$('#pr').value;if(!a)return toast('Artículo no encontrado');if(q<=0||p<0)return toast('Revisá cantidad y precio');
const ya=C.items.filter(i=>i.a==a.id).reduce((s,i)=>s+i.q,0);
if(C.m=='v'&&!['Presupuesto','Pedido','Nota de Crédito'].includes(C.tipo)&&ya+q>a.stock)return toast('Stock insuficiente (hay '+a.stock+')');
C.items.push({a:a.id,n:a.nombre,q,p,c:a.costo});drawCart()}
function apply(d,s){const sg=d.tipo=='Compra'||d.tipo=='Nota de Crédito'?1:['Presupuesto','Pedido'].includes(d.tipo)?0:-1;

function infR(){const g=(l,h,c)=>`<label class="${c||''}">${l}${h}</label>`,inp=(k,x)=>`<input value="${esc(IS[k])}" onchange="IS.${k}=this.value" ${x||''}>`,ie=(i,k,l,c)=>g(l,`<input value="${esc(IS.eq[i][k])}" onchange="IS.eq[${i}].${k}=this.value">`,c);
setV(IS.id?'Editar informe técnico':'Informe técnico',`<div class="card"><div class="fg">${g('Registro N°',`<input class="ro" readonly value="${IS.reg}">`)}${g('Fecha',inp('fecha','type="date"'))}${g('Código Cliente',`<div class="ig"><input class="ro" readonly value="${esc(IS.cod)}"><button type="button" class="ab" onclick="bcliI()">${I('search')} F3</button><button type="button" class="ab" style="margin-left:6px;border-radius:.25rem" onclick="ncliX(c=>infC(c.id))">${I('plus')} Nuevo</button></div>`)}${g('Nombre y apellido',inp('nom','readonly class="ro"'),'w2')}${g('DNI',inp('doc','readonly class="ro"'))}${g('Dirección',inp('dir','readonly class="ro"'),'w2')}${g('Localidad',inp('loc','readonly class="ro"'))}${g('Mail del cliente',inp('email','readonly class="ro"'))}</div></div>
${IS.eq.map((e,i)=>`<div class="card"><div class="fg">${ie(i,'tipo','Equipo (tipo)')}${ie(i,'marca','Marca')}${ie(i,'modelo','Modelo')}${ie(i,'dano','Daño','w2')}${ie(i,'obs','Observaciones','w2')}</div>${IS.eq.length>1?`<button class="b" style="margin-top:8px" onclick="IS.eq.splice(${i},1);infR()">Quitar equipo ${i+1}</button>`:''}</div>`).join('')}

function infS(cb){const ec=cliChk(IS.cid);if(ec)return toast(ec);if(!IS.nom.trim())return toast('Falta el nombre y apellido');if(!IS.eq.some(e=>e.tipo||e.marca||e.modelo))return toast('Cargá al menos un equipo');let r;

if(d.length==12){const c=new Set();for(const p of [2,3,4])if(d.slice(p,p+2)=='15'){const n=d.slice(0,p)+d.slice(p+2);if(WA_OK.test(n)&&(n.startsWith('11')==(p==2)))c.add(n)}

else if(d.length==10){if(/(^|\D)15(\D|$)/.test(s))return{ok:0,cod:'incompleto',msg:'El número está incompleto: tiene el 15 pero faltan dígitos.'};nat=d}
else if(d.length==11&&[2,3,4].some(p=>d.slice(p,p+2)=='15'))return{ok:0,cod:'incompleto',msg:'El número está incompleto: tiene el 15 pero faltan dígitos.'};
else if(d.length<10)return{ok:0,cod:'incompleto',msg:'El número está incompleto: tiene '+d.length+' dígitos y necesita característica + número (10 dígitos).'};
else return{ok:0,cod:'invalido',msg:'El número tiene demasiados dígitos.'};

function go(k){if(k=='home')home();else if(k=='art')arts();else if(k=='cli')clis();else if(FM[k])list(k);else if(k=='comp')compra();else if(['Factura','Remito','Presupuesto','Pedido','Nota de Crédito'].includes(k))vta(k);else if(k=='cons')cons();else if(k.startsWith('cons:')){FQ.t=k.slice(5);cons()}else if(R2[k])R2[k]();else if(k.startsWith('r:'))grp(k.slice(2),REP[k.slice(2)]);else if(k.startsWith('c:'))chqr(k.slice(2));else if(k=='caja')caja();else if(['val','crit','vart'].includes(k))rep(k);else if(k=='adm')adm();
document.querySelectorAll('.l,.g').forEach(e=>e.classList.toggle('on',e.dataset.k==k));document.querySelectorAll('.l.on').forEach(e=>{const m=e.closest('.mg');if(m)m.classList.add('open')})}
